# MyZorinOS Build Configuration

# Build type: full, minimal, server
BUILD_TYPE=full

# Installation path
INSTALL_PATH=/opt/myzorinos

# Default theme
THEME_NAME=myzorinos-dark

# Default layout
DEFAULT_LAYOUT=windows

# Enable compositor by default
ENABLE_COMPOSITOR=true

# Enable autostart
ENABLE_AUTOSTART=true

# Build ISO
BUILD_ISO=false
ISO_VERSION=1.0.0
ISO_LABEL=MyZorinOS
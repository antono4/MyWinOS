# MyZorinOS Compositor Configuration
# Configuration for window compositor (picom/compton)

## Backend
backend = "glx";
# backend = "xrender";  # Fallback for older hardware

## GLX
glx-no-stencil = true;
glx-copy-from-front = false;
glx-swap-method = "buffer-age";
use-damage = true;

## Shadows
shadow = true;
shadow-radius = 15;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.5;
shadow-ignore-shaped = false;
no-dnd-shadow = true;
no-dock-shadow = true;

## Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 7;

## Window type settings
wintypes:
{
    tooltip = { fade = true; shadow = false; focus = true; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
    utility = { opacity = 0.95; };
    dialog = { opacity = 0.95; };
    normal = { opacity = 1.0; };
    toolbar = { opacity = 0.95; };
};

## Blur settings (for transparent panels)
# blur-method = "dual_kawase";
# blur-size = 10;
# blur-deviation = 5;
# blur-strength = 5;

## Performance
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

## Exclude windows
exclude = [
    "class_g = 'Cairo-dock'",
    "class_g = 'Xfce4-notifyd'",
    "class_g = 'Notify-osd'",
    "class_g = 'stalonetray'",
    "class_g = 'Kupfer'",
    "class_g = 'Dockbarx'",
    "class_g = 'tint2'",
    "name = 'Notification'",
    "window_type = 'desktop'",
    "window_type = 'utility'",
    "window_type = 'toolbar'",
    "window_type = 'menu'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'",
    "_GTK_FRAME_EXTENTS@:c"
];

## Log
log-level = "info";
log-file = "/tmp/compositor.log";